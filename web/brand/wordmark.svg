<svg xmlns="http://www.w3.org/2000/svg" viewBox="248 428 504 136" width="504" height="136">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a232b" />
      <stop offset="60%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0c0d10" />
    </radialGradient>

    <!-- Metal Armor Gradients -->
    <linearGradient id="metalPlateTop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#d1d8e0" />
      <stop offset="35%" stop-color="#8a95a5" />
      <stop offset="70%" stop-color="#4b5361" />
      <stop offset="100%" stop-color="#2a303c" />
    </linearGradient>

    <linearGradient id="metalPlateBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9aa5b5" />
      <stop offset="50%" stop-color="#5a6372" />
      <stop offset="100%" stop-color="#252b36" />
    </linearGradient>

    <linearGradient id="innerOrangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="60%" stop-color="#ff4800" />
      <stop offset="100%" stop-color="#991500" />
    </linearGradient>

    <!-- Bullet Gold Gradient -->
    <linearGradient id="bulletGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1b0" />
      <stop offset="30%" stop-color="#e8b948" />
      <stop offset="70%" stop-color="#9e6e19" />
      <stop offset="100%" stop-color="#472d04" />
    </linearGradient>

    <linearGradient id="bulletTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffde87" />
      <stop offset="50%" stop-color="#d48a1c" />
      <stop offset="100%" stop-color="#693b04" />
    </linearGradient>

    <!-- Flame Gradients -->
    <linearGradient id="fireGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ffee55" />
    </linearGradient>

    <linearGradient id="fireGrad2" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3c00" />
      <stop offset="100%" stop-color="#ffbb00" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="textMetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#d0d7de" />
      <stop offset="50%" stop-color="#7a8799" />
      <stop offset="52%" stop-color="#3d4452" />
      <stop offset="80%" stop-color="#606b7d" />
      <stop offset="100%" stop-color="#2b313d" />
    </linearGradient>

    <linearGradient id="orangeStrokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4400" />
      <stop offset="50%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ff4400" />
    </linearGradient>

    <!-- Drop Shadows / Glow Filters -->
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseFire" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
